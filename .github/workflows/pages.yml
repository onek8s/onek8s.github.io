name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
      - name: The three PDFs
        run: |
          sudo chown -R "$(id -u)" _site
          python3 scripts/pdf.py _site _site/onek8s-design-summary.pdf --only 1.0 --subtitle Summary
          python3 scripts/pdf.py _site _site/onek8s-design.pdf --only 1-6
          python3 scripts/pdf.py _site _site/onek8s-design-reference.pdf --only 7-8 --subtitle "Decisions and reference"
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
