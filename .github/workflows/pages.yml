name: Deploy GitHub Pages

on:
  push:
    # Temporary, for reviewing pull request 109: remove the review branch before it merges.
    branches: [main, claude/requirements-driven-collaboration-vv1mpe]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
      - name: The two PDFs
        run: |
          sudo chown -R "$(id -u)" _site
          python3 scripts/pdf.py _site _site/onek8s-requirements.pdf --only requirements --subtitle Requirements
          python3 scripts/pdf.py _site _site/onek8s-design.pdf --only design
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
