name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagrams rendered and links resolve
        run: scripts/check.sh

  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
      - name: The three PDFs, every internal link with a target
        run: |
          sudo chown -R "$(id -u)" _site
          python3 scripts/pdf.py _site onek8s-design-summary.pdf --only 1.0 --subtitle Summary
          python3 scripts/pdf.py _site onek8s-design.pdf --only 1-6
          python3 scripts/pdf.py _site onek8s-design-reference.pdf --only 7-8 --subtitle "Decisions and reference"
      - uses: actions/upload-artifact@v4
        with:
          name: onek8s-design-pdf
          path: onek8s-design*.pdf
