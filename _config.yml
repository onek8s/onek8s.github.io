title: OneK8s
# The design's version: the newest entry of design/8.1-release-notes.md (scripts/check.sh compares the two).
version: "4.5"
description: One Kubernetes platform, one application contract for every cloud - built on Azure (AKS) first.
# Used by the "Edit this page" links.
repository: onek8s/onek8s.github.io
branch: main
# Only publish the requirements, the design and their pictures, the lab examples (examples/lab/, generated by the
# documentation agent, in neither PDF) and 404.html, which redirects old URLs. archive/ keeps what no requirement
# names, outside the site and the PDFs.
exclude:
  - archive
  - CLAUDE.md
  - reviews
  - CONTRIBUTING.md
  - diagrams
  - scripts
