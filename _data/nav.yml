# Site navigation: the reading order of the site, in numbered parts.
#
# Part 0 is the requirements and acceptance criteria in requirements/, owned by humans (a change needs a human's
# approval); parts 1 to 8 are the design in design/, owned by AI (a change needs the AI's review). A page is numbered
# <part>.<page>, and the pictures carry the number of the page that shows them. The front page (README.md, how we
# work) comes first and the layout shows it above both owners' parts. The layout builds the sidebar and the previous /
# next links from this list; scripts/check.sh fails when it and the files in requirements/ and design/ disagree.
#
# `pdf:` names the PDF a page is printed in - `requirements` (onek8s-requirements.pdf, every page of requirements/ and
# no other) or `design` (onek8s-design.pdf, every page of design/); scripts/pdf.py --only <name> selects them. Only the
# front page (README.md) has no `pdf:`. What no requirement names is kept in archive/, outside the site and the PDFs.

- number: 0
  part: Requirements
  pages:
    - path: README.md
      title: How we work
    - path: requirements/0.2-requirements.md
      number: "0.2"
      title: Requirements
      pdf: requirements
    - path: requirements/0.3-acceptance-criteria.md
      number: "0.3"
      title: Acceptance criteria
      pdf: requirements

