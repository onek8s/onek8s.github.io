# Site navigation: the reading order of the design, in parts.
#
# The sections are numbered in this order, and the pictures carry the number of the section that shows them. The
# layout builds the sidebar and the previous / next links from this list; README.md repeats it with a one-line
# description per page, and scripts/check.sh fails when the two lists or the files in docs/ disagree.
- part: Start here
