<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found – {{ site.title }}</title>
<script>
  // The design moved from docs/ to design/ in v3.9, and its requirements page 1.2 became requirements/0.2: send the
  // old addresses to the new ones, keeping the heading (#...) they pointed at; 7.1's acceptance tests are 0.3 now.
  // v4.0 moved the pages no requirement names (7.1, 7.4, 7.5) out of the site: their addresses go to the nearest page.
  (function () {
    var base = '{{ "/" | relative_url }}';
    var path = location.pathname;
    var m = path.match(/\/(docs|design)\/([^/]+?)(?:\.html|\.md)?$/);
    if (!m) return;
    var name = m[2];
    var hash = location.hash;
    var moved = /^#(requirement-and-isolation-tests|cis-benchmark|performance-and-capacity|high-availability-and-resilience|shared-tier-failure-domains|zero-downtime-upgrades-and-changes|rebuild-backup-and-recovery|operations)$/;
    var target;
    if (/^7\.1-/.test(name)) {
      // 7.1's acceptance tests are 0.3; the rest of the page (build tenant, phases, reviews) is archived.
      target = 'requirements/0.3-acceptance-criteria.html';
      if (!moved.test(hash)) hash = '';
    } else if (/^7\.4-/.test(name)) {
      target = 'design/7.2-decisions.html';
      hash = '';
    } else if (/^7\.5-/.test(name)) {
      // Its data services joined 1.3 under the same heading.
      target = 'design/1.3-open-standards-and-portability.html';
      if (hash !== '#data-in-paas-services-that-every-cloud-offers') hash = '';
    } else if (m[1] === 'design') {
      return;
    } else if (name === '1.2-requirements') {
      // 1.2's headings (cells and bulkheads, ...) stayed in the design's page 1.2; its table of requirements is 0.2.
      target = hash ? 'design/1.2-how-the-design-meets-the-requirements.html' : 'requirements/0.2-requirements.html';
    } else {
      target = 'design/' + name + '.html';
    }
    location.replace(base + target + location.search + hash);
  })();
</script>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 4rem 16px; font: 16px/1.5 system-ui, sans-serif; text-align: center;
    background: #fff; color: #1f2328; }
  a { color: #0b5cad; }
  @media (prefers-color-scheme: dark) { body { background: #0f141a; color: #e6edf3; } a { color: #79b8ff; } }
</style>
</head>
<body>
<h1>Page not found</h1>
<p>This page does not exist. The design's pages are listed on the <a href="{{ '/' | relative_url }}">home page</a>.</p>
</body>
</html>
